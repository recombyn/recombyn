name: protocol-contract-smoke

# Public guard + optional cross-repo ping to Private compatibility CI.
# Private workflow: recombyn-intelligence/.github/workflows/protocol-compat.yml
# (repository_dispatch type: protocol-changed)

on:
  push:
    paths:
      - "packages/protocol/**"
      - "packages/runtime/**"
      - ".github/workflows/protocol-contract-smoke.yml"
  pull_request:
    paths:
      - "packages/protocol/**"
      - "packages/runtime/**"
      - ".github/workflows/protocol-contract-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protocol + runtime
        run: |
          python -m pip install -U pip
          python -m pip install -e ./packages/protocol
          python -m pip install -e ./packages/runtime
      - name: Assert contract helpers
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from recombyn_protocol.intelligence import (
              INTELLIGENCE_METHODS,
              intelligence_wire_methods,
              remote_result_usable,
          )
          from recombyn_runtime import remote_result_usable as runtime_usable
          assert version("recombyn-protocol")
          parts = [int(x) for x in version("recombyn-protocol").split(".")[:3]]
          assert parts >= [0, 1, 1], version("recombyn-protocol")
          assert len(INTELLIGENCE_METHODS) >= 15
          assert intelligence_wire_methods() >= set(INTELLIGENCE_METHODS)
          assert not remote_result_usable("research", {})
          assert remote_result_usable("research", {"summary": "ok"})
          assert remote_result_usable("govern", {"status": "pass"})
          assert runtime_usable("govern", {"status": "pass"})
          print("protocol contract smoke ok", version("recombyn-protocol"), len(INTELLIGENCE_METHODS), "methods")
          PY

  # Notify Private only on push to default branch (or manual dispatch), never on fork PRs.
  dispatch-private:
    needs: smoke
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protocol-changed to Private
        env:
          TOKEN: ${{ secrets.INTELLIGENCE_REPO_DISPATCH_TOKEN }}
          TARGET: ${{ vars.INTELLIGENCE_REPO || 'recombyn/recombyn-intelligence' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Skip: set secret INTELLIGENCE_REPO_DISPATCH_TOKEN (PAT with repo scope on Private) to enable cross-repo CI."
            exit 0
          fi
          REF="${{ github.sha }}"
          echo "Dispatching protocol-changed → $TARGET (protocol_ref=$REF)"
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET}/dispatches" \
            -d "{\"event_type\":\"protocol-changed\",\"client_payload\":{\"protocol_ref\":\"${REF}\",\"public_sha\":\"${REF}\",\"source\":\"recombyn/recombyn\"}}"
