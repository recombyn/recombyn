# Depth layering is served by recombyn-intelligence at /api/v1/pipeline/*.
# Enable intelligence profile — no separate image-layer-pipeline service required.
#
#   docker compose -f docker-compose.yml -f docker-compose.intelligence.yml \
#     --profile intelligence up -d --build
#
# With intelligence running, set in apps/api/.env:
#   RECOMBYN_INTELLIGENCE_MODE=cloud
#   RECOMBYN_INTELLIGENCE_URL=http://127.0.0.1:8091
#   RECOMBYN_INTELLIGENCE_API_KEY=dev-key
#   IMAGE_LAYER_PIPELINE_MODE=ilp

services:
  api:
    environment:
      - RECOMBYN_INTELLIGENCE_MODE=${RECOMBYN_INTELLIGENCE_MODE:-cloud}
      - RECOMBYN_INTELLIGENCE_URL=${RECOMBYN_INTELLIGENCE_URL:-http://intelligence:8091}
      - RECOMBYN_INTELLIGENCE_API_KEY=${RECOMBYN_INTELLIGENCE_API_KEY:-dev-key}
      - IMAGE_LAYER_PIPELINE_MODE=${IMAGE_LAYER_PIPELINE_MODE:-ilp}
      - IMAGE_LAYER_PIPELINE_TIMEOUT_SEC=${IMAGE_LAYER_PIPELINE_TIMEOUT_SEC:-300}
      - IMAGE_LAYER_PIPELINE_POLL_SEC=${IMAGE_LAYER_PIPELINE_POLL_SEC:-1}
