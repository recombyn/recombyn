# Optional override: attach an HTTP IntelligenceProvider (ADR 0017).
# Community default remains BasicLocal — do not enable this profile unless you
# operate a compatible provider (sibling checkout or your own image).
#
#   docker compose -f docker-compose.yml -f docker-compose.intelligence.yml \
#     --profile intelligence up -d --build
#
# Point RECOMBYN_INTELLIGENCE_CONTEXT at a checkout that ships a Dockerfile
# implementing POST /v1/{method} + GET /health.

services:
  intelligence:
    profiles: ["intelligence"]
    build:
      context: ${RECOMBYN_INTELLIGENCE_CONTEXT:-../recombyn-intelligence}
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      INTELLIGENCE_SERVICE_API_KEY: ${RECOMBYN_INTELLIGENCE_API_KEY:-dev-key}
      INTELLIGENCE_SERVICE_HOST: 0.0.0.0
      INTELLIGENCE_SERVICE_PORT: 8091
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 8s

  api:
    environment:
      - RECOMBYN_INTELLIGENCE_MODE=${RECOMBYN_INTELLIGENCE_MODE:-cloud}
      - RECOMBYN_INTELLIGENCE_URL=${RECOMBYN_INTELLIGENCE_URL:-http://intelligence:8091}
      - RECOMBYN_INTELLIGENCE_API_KEY=${RECOMBYN_INTELLIGENCE_API_KEY:-dev-key}
      - RECOMBYN_INTELLIGENCE_TIMEOUT_SEC=${RECOMBYN_INTELLIGENCE_TIMEOUT_SEC:-30}
    depends_on:
      intelligence:
        condition: service_healthy
